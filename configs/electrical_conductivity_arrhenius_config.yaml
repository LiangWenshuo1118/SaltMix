data:
  raw_electrical_conductivity_dir: data/electrical_conductivity
  validation_ratio: 0.2
  temperatures_per_record: 5
  excluded_systems:
    # EXP_EC_P216_031/KF-ZrF4: formula-calculated values do not match the values provided in the reference.
    - KF-ZrF4
  excluded_record_ids:
    # EXP_EC_P212_009/KCl-PrCl3 and EXP_EC_P239_043/NaCl-PrCl3: fixed-temperature composition polynomials are inconsistent with the specific-conductivity scale of the surrounding Arrhenius records.
    - EXP_EC_P212_009
    - EXP_EC_P239_043

model:
  embed_dim: 128
  encoder_dim: 128
  num_heads: 4
  num_layers: 2
  ff_dim: 256
  subnet_dim: 128
  use_phy: true
  use_arrhenius: true
  use_linear: false
  use_rk: false
  rk_order: 2
  dropout: 0.1

training:
  seed: 42
  low_data_learning: false
  batch_size: 64
  learning_rate: 0.0005
  grad_clip_max_norm: 1.0
  weight_decay: 0.0001
  ema_decay: 0.98
  early_stopping_patience: 20
  loss: log_cosh
  epochs: 200
  output_dir: outputs/electrical_conductivity_arrhenius_results
